<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1014"/><stop offset="1" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#8fb0ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.16"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1400" height="560" fill="url(#bg)"/>
  <rect width="1400" height="560" fill="url(#glow)"/>

  <!-- Brand -->
  <g transform="translate(100, 108) scale(0.72)" filter="url(#ds)">
    <rect width="128" height="128" rx="24" fill="#12151d" stroke="#262c38" stroke-width="2"/>
    <path d="M64 10C46 38 30 55 30 76a34 34 0 0 0 68 0C98 55 82 38 64 10Z" fill="#5b8cff"/>
    <path d="m62 58 48 18-20.5 8L81.5 106 62 58Z" fill="#fff" stroke="#12151d" stroke-width="7" stroke-linejoin="round"/>
  </g>
  <text x="216" y="176" font-size="60" font-weight="800" fill="#e8eaf0">Ink<tspan fill="#5b8cff" font-style="italic">spect</tspan></text>

  <text x="102" y="262" font-size="24" fill="#a9b0bf">Preview every viewport. Annotate the real page.</text>
  <text x="102" y="298" font-size="24" fill="#a9b0bf">Share it with a link.</text>

  <!-- Feature chips -->
  <rect x="102" y="348" width="216" height="40" rx="20" fill="#151820" stroke="#262c38" stroke-width="1.5"/>
  <circle cx="126" cy="368" r="5" fill="#5b8cff"/>
  <text x="140" y="374" font-size="15" fill="#e8eaf0">Synced device frames</text>
  <rect x="330" y="348" width="180" height="40" rx="20" fill="#151820" stroke="#262c38" stroke-width="1.5"/>
  <circle cx="354" cy="368" r="5" fill="#ff5d5d"/>
  <text x="368" y="374" font-size="15" fill="#e8eaf0">Visual feedback</text>
  <rect x="102" y="400" width="176" height="40" rx="20" fill="#151820" stroke="#262c38" stroke-width="1.5"/>
  <circle cx="126" cy="420" r="5" fill="#3ecf6e"/>
  <text x="140" y="426" font-size="15" fill="#e8eaf0">Live CSS editor</text>
  <rect x="290" y="400" width="232" height="40" rx="20" fill="#151820" stroke="#262c38" stroke-width="1.5"/>
  <circle cx="314" cy="420" r="5" fill="#ffb340"/>
  <text x="328" y="426" font-size="15" fill="#e8eaf0">Annotated screenshots</text>

  <!-- Laptop with annotations -->
  <g transform="rotate(-1.5, 900, 250)">
    <g filter="url(#ds)"><rect x="660" y="90" width="450" height="330" rx="14" fill="#151820" stroke="#262c38" stroke-width="1.5"/></g>
    <text x="674" y="114" font-size="13" font-weight="600" fill="#a9b0bf">Laptop</text>
    <text x="1096" y="114" font-size="11" fill="#6f7686" text-anchor="end">1440×900</text>
    <rect x="661.5" y="126" width="447" height="292" rx="10" fill="#ffffff"/>
    <rect x="661.5" y="126" width="447" height="44" rx="10" fill="#f6f8fc"/>
    <rect x="661.5" y="152" width="447" height="18" fill="#f6f8fc"/>
    <circle cx="685" cy="148" r="7" fill="#5b8cff"/>
    <rect x="699" y="143" width="44" height="10" rx="5" fill="#8d97a8"/>
    <rect x="960" y="145" width="28" height="5" rx="2.5" fill="#9aa4b5"/>
    <rect x="1000" y="145" width="28" height="5" rx="2.5" fill="#9aa4b5"/>
    <rect x="1040" y="145" width="28" height="5" rx="2.5" fill="#9aa4b5"/>
    <rect x="677" y="186" width="416" height="120" rx="12" fill="url(#hero)"/>
    <rect x="699" y="212" width="180" height="12" rx="6" fill="#fff" opacity="0.95"/>
    <rect x="699" y="232" width="130" height="12" rx="6" fill="#fff" opacity="0.85"/>
    <rect x="699" y="260" width="96" height="28" rx="14" fill="#fff"/>
    <rect x="712" y="270" width="70" height="8" rx="4" fill="#5b8cff"/>
    <rect x="940" y="202" width="130" height="88" rx="8" fill="#ffffff" opacity="0.25"/>
    <rect x="677" y="322" width="128" height="78" rx="10" fill="#eef1f6"/>
    <rect x="685" y="330" width="112" height="36" rx="6" fill="#dbe1ec"/>
    <rect x="685" y="374" width="82" height="7" rx="3.5" fill="#c9d0dc"/>
    <rect x="817" y="322" width="128" height="78" rx="10" fill="#eef1f6"/>
    <rect x="825" y="330" width="112" height="36" rx="6" fill="#dbe1ec"/>
    <rect x="825" y="374" width="82" height="7" rx="3.5" fill="#c9d0dc"/>
    <rect x="957" y="322" width="128" height="78" rx="10" fill="#eef1f6"/>
    <rect x="965" y="330" width="112" height="36" rx="6" fill="#dbe1ec"/>
    <rect x="965" y="374" width="82" height="7" rx="3.5" fill="#c9d0dc"/>
    <!-- green element pick -->
    <rect x="813" y="318" width="136" height="86" fill="#3ecf6e" fill-opacity="0.08" stroke="#3ecf6e" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="815" y="312" font-size="11.5" font-weight="700" fill="#3ecf6e" font-family="ui-monospace, Menlo, monospace">div.card</text>
    <!-- orange arrow -->
    <path d="M 905,236 L 962,152" fill="none" stroke="#ffb340" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 950,153 L 962,152 L 960,164" fill="none" stroke="#ffb340" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Phone with pin + note -->
  <g transform="rotate(3, 1245, 300)">
    <g filter="url(#ds)"><rect x="1150" y="120" width="190" height="380" rx="14" fill="#151820" stroke="#262c38" stroke-width="1.5"/></g>
    <text x="1164" y="144" font-size="12" font-weight="600" fill="#a9b0bf">iPhone SE</text>
    <rect x="1151.5" y="156" width="187" height="342" rx="10" fill="#ffffff"/>
    <rect x="1151.5" y="156" width="187" height="36" rx="10" fill="#f6f8fc"/>
    <rect x="1151.5" y="176" width="187" height="16" fill="#f6f8fc"/>
    <circle cx="1170" cy="174" r="6" fill="#5b8cff"/>
    <rect x="1182" y="170" width="34" height="8" rx="4" fill="#8d97a8"/>
    <rect x="1162" y="204" width="166" height="112" rx="10" fill="url(#hero)"/>
    <rect x="1174" y="224" width="104" height="10" rx="5" fill="#fff" opacity="0.95"/>
    <rect x="1174" y="241" width="72" height="10" rx="5" fill="#fff" opacity="0.85"/>
    <rect x="1174" y="272" width="76" height="24" rx="12" fill="#fff"/>
    <rect x="1185" y="281" width="54" height="6" rx="3" fill="#5b8cff"/>
    <rect x="1162" y="332" width="166" height="8" rx="4" fill="#e2e6ee"/>
    <rect x="1162" y="348" width="144" height="8" rx="4" fill="#e2e6ee"/>
    <rect x="1162" y="376" width="78" height="60" rx="8" fill="#eef1f6"/>
    <rect x="1168" y="382" width="66" height="28" rx="5" fill="#dbe1ec"/>
    <rect x="1250" y="376" width="78" height="60" rx="8" fill="#eef1f6"/>
    <rect x="1256" y="382" width="66" height="28" rx="5" fill="#dbe1ec"/>
    <!-- red freehand on logo -->
    <path d="M 1158,174 C 1155,164 1172,158 1188,162 C 1202,166 1204,178 1192,182 C 1178,186 1160,182 1158,175" fill="none" stroke="#ff5d5d" stroke-width="2.5" stroke-linecap="round"/>
    <!-- red pin + bubble -->
    <circle cx="1252" cy="284" r="10" fill="#ff5d5d" stroke="#fff" stroke-width="1.8"/>
    <text x="1252" y="288" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <rect x="1170" y="300" width="128" height="26" rx="7" fill="rgba(14,16,20,0.92)" stroke="#ff5d5d"/>
    <text x="1180" y="317" font-size="11.5" fill="#fff">Logo too small</text>
  </g>
</svg>
