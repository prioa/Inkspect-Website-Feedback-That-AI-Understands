<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1014"/><stop offset="1" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#8fb0ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.17"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1400" height="560" fill="url(#bg)"/>
  <rect width="1400" height="560" fill="url(#glow)"/>

  <!-- Brand -->
  <g transform="translate(96, 74) scale(0.58)" filter="url(#ds)">
    <rect width="128" height="128" rx="24" fill="#12151d" stroke="#262c38" stroke-width="2"/>
    <path d="M64 10C46 38 30 55 30 76a34 34 0 0 0 68 0C98 55 82 38 64 10Z" fill="#5b8cff"/>
    <path d="m62 58 48 18-20.5 8L81.5 106 62 58Z" fill="#fff" stroke="#12151d" stroke-width="7" stroke-linejoin="round"/>
  </g>
  <text x="184" y="130" font-size="44" font-weight="800" fill="#e8eaf0">Ink<tspan fill="#5b8cff" font-style="italic">spect</tspan></text>

  <text x="98" y="222" font-size="38" font-weight="800" fill="#e8eaf0">Website feedback</text>
  <text x="98" y="270" font-size="38" font-weight="800" fill="#e8eaf0">that <tspan fill="#5b8cff">AI</tspan> understands.</text>

  <text x="98" y="318" font-size="18" fill="#a9b0bf">Mark up the real page, edit it live — and hand over the</text>
  <text x="98" y="344" font-size="18" fill="#a9b0bf">CSS selector and the exact values for every note.</text>

  <!-- Feature chips -->
  <rect x="98" y="384" width="222" height="40" rx="20" fill="#151820" stroke="#262c38" stroke-width="1.5"/>
  <circle cx="122" cy="404" r="5" fill="#5b8cff"/>
  <text x="136" y="410" font-size="15" fill="#e8eaf0">Selectors &amp; exact values</text>
  <rect x="332" y="384" width="176" height="40" rx="20" fill="#151820" stroke="#262c38" stroke-width="1.5"/>
  <circle cx="356" cy="404" r="5" fill="#3ecf6e"/>
  <text x="370" y="410" font-size="15" fill="#e8eaf0">Live element edits</text>
  <rect x="98" y="436" width="196" height="40" rx="20" fill="#151820" stroke="#262c38" stroke-width="1.5"/>
  <circle cx="122" cy="456" r="5" fill="#ffb340"/>
  <text x="136" y="462" font-size="15" fill="#e8eaf0">Share link, no server</text>
  <rect x="306" y="436" width="186" height="40" rx="20" fill="#151820" stroke="#262c38" stroke-width="1.5"/>
  <circle cx="330" cy="456" r="5" fill="#6d8cc0"/>
  <text x="344" y="462" font-size="15" fill="#e8eaf0">Annotated PDF export</text>

  <!-- Page with markings -->
  <g transform="rotate(-1.2, 880, 240)">
    <g filter="url(#ds)"><rect x="660" y="66" width="470" height="342" rx="14" fill="#151820" stroke="#262c38" stroke-width="1.5"/></g>
    <text x="674" y="90" font-size="13" font-weight="600" fill="#a9b0bf">Laptop</text>
    <text x="1116" y="90" font-size="11" fill="#6f7686" text-anchor="end">1440×900</text>
    <rect x="661.5" y="102" width="467" height="304" rx="10" fill="#ffffff"/>
    <rect x="661.5" y="102" width="467" height="44" rx="10" fill="#f6f8fc"/>
    <rect x="661.5" y="128" width="467" height="18" fill="#f6f8fc"/>
    <circle cx="685" cy="124" r="7" fill="#5b8cff"/>
    <rect x="699" y="119" width="44" height="10" rx="5" fill="#8d97a8"/>
    <rect x="980" y="121" width="28" height="5" rx="2.5" fill="#9aa4b5"/>
    <rect x="1020" y="121" width="28" height="5" rx="2.5" fill="#9aa4b5"/>
    <rect x="1060" y="121" width="28" height="5" rx="2.5" fill="#9aa4b5"/>
    <rect x="677" y="162" width="436" height="130" rx="12" fill="url(#hero)"/>
    <rect x="699" y="190" width="190" height="12" rx="6" fill="#fff" opacity="0.95"/>
    <rect x="699" y="210" width="136" height="12" rx="6" fill="#fff" opacity="0.85"/>
    <rect x="699" y="242" width="104" height="30" rx="15" fill="#fff"/>
    <rect x="713" y="253" width="76" height="8" rx="4" fill="#5b8cff"/>
    <rect x="960" y="178" width="130" height="98" rx="8" fill="#ffffff" opacity="0.25"/>
    <rect x="677" y="308" width="138" height="86" rx="10" fill="#eef1f6"/>
    <rect x="686" y="317" width="120" height="40" rx="6" fill="#dbe1ec"/>
    <rect x="686" y="366" width="86" height="7" rx="3.5" fill="#c9d0dc"/>
    <rect x="827" y="308" width="138" height="86" rx="10" fill="#eef1f6"/>
    <rect x="836" y="317" width="120" height="40" rx="6" fill="#dbe1ec"/>
    <rect x="836" y="366" width="86" height="7" rx="3.5" fill="#c9d0dc"/>
    <rect x="977" y="308" width="138" height="86" rx="10" fill="#eef1f6"/>
    <rect x="986" y="317" width="120" height="40" rx="6" fill="#dbe1ec"/>
    <rect x="986" y="366" width="86" height="7" rx="3.5" fill="#c9d0dc"/>

    <!-- element pick on the CTA, with the change written next to it -->
    <rect x="695" y="238" width="112" height="38" fill="#3ecf6e" fill-opacity="0.08" stroke="#3ecf6e" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="695" y="206" width="182" height="24" rx="6" fill="rgba(14,16,20,0.94)" stroke="#3ecf6e" stroke-width="1.2"/>
    <text x="707" y="223" font-size="12" font-weight="700" fill="#3ecf6e" font-family="ui-monospace, Menlo, monospace">a.btn--primary <tspan fill="#8b93a5" font-weight="400">104 × 30</tspan></text>
    <rect x="815" y="240" width="180" height="34" rx="8" fill="rgba(14,16,20,0.92)" stroke="#3ecf6e" stroke-width="1.2"/>
    <text x="829" y="261" font-size="12" fill="#fff" font-family="ui-monospace, Menlo, monospace">padding-top 8 <tspan fill="#3ecf6e">→ 14</tspan></text>

    <!-- comment pin -->
    <circle cx="1052" cy="196" r="11" fill="#6d8cc0" stroke="#fff" stroke-width="1.8"/>
    <text x="1052" y="200" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  </g>

  <!-- The export it produces -->
  <g filter="url(#ds)"><rect x="806" y="344" width="524" height="176" rx="14" fill="#0f1218" stroke="#2c3342" stroke-width="1.5"/></g>
  <rect x="806" y="344" width="524" height="38" rx="14" fill="#151a22"/>
  <rect x="806" y="368" width="524" height="14" fill="#151a22"/>
  <line x1="806" y1="382" x2="1330" y2="382" stroke="#2c3342"/>
  <circle cx="828" cy="363" r="4" fill="#3a4356"/>
  <circle cx="842" cy="363" r="4" fill="#3a4356"/>
  <circle cx="856" cy="363" r="4" fill="#3a4356"/>
  <text x="874" y="368" font-size="12.5" fill="#8b93a5" font-family="ui-monospace, Menlo, monospace">feedback.md</text>
  <rect x="1236" y="352" width="80" height="22" rx="11" fill="#5b8cff" fill-opacity="0.15" stroke="#5b8cff" stroke-opacity="0.5"/>
  <text x="1276" y="367" font-size="11" font-weight="600" fill="#5b8cff" text-anchor="middle">Markdown</text>

  <text x="828" y="412" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#e8eaf0">- [ ] Make the CTA full width — <tspan fill="#8fb0ff">a.btn--primary</tspan></text>
  <text x="848" y="436" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#6f7686">selector: <tspan fill="#a9b0bf">section.hero &gt;&gt;&gt; a.btn--primary</tspan></text>
  <text x="848" y="460" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#6f7686">change on .btn--primary: <tspan fill="#a9b0bf">padding-top 8px</tspan> <tspan fill="#3ecf6e">→ 14px</tspan></text>
  <text x="848" y="484" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#6f7686">text: <tspan fill="#a9b0bf">"Jetzt starten"</tspan> <tspan fill="#3ecf6e">→ "Kostenlos testen"</tspan></text>
  <text x="848" y="508" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#6f7686">position: <tspan fill="#a9b0bf">412, 980 (document px)</tspan></text>
</svg>
