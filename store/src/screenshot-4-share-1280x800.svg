<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1014"/><stop offset="1" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#8fb0ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.13"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>

  <text x="80" y="96" font-size="44" font-weight="800" fill="#e8eaf0">Hand it off — as a link or as images.</text>
  <text x="80" y="138" font-size="20" fill="#a9b0bf">Feedback travels inside the URL — no server, no account. Or download annotated screenshots.</text>

  <!-- Share card -->
  <g filter="url(#ds)"><rect x="80" y="220" width="540" height="330" rx="16" fill="#151820" stroke="#262c38" stroke-width="1.5"/></g>
  <text x="112" y="270" font-size="19" font-weight="700" fill="#e8eaf0">Share as link</text>
  <rect x="112" y="296" width="440" height="42" rx="10" fill="#0e1014" stroke="#37404f"/>
  <text x="126" y="322" font-size="12.5" fill="#a9b0bf" font-family="ui-monospace, Menlo, monospace">https://app.example.com/#ink-feedback=eNqNkMFOwz…</text>
  <rect x="562" y="296" width="42" height="42" rx="10" fill="#262c38"/>
  <rect x="576" y="309" width="11" height="13" rx="2" fill="none" stroke="#a9b0bf" stroke-width="1.8"/>
  <rect x="580" y="313" width="11" height="13" rx="2" fill="#262c38" stroke="#a9b0bf" stroke-width="1.8"/>

  <circle cx="122" cy="378" r="9" fill="none" stroke="#3ecf6e" stroke-width="2"/>
  <path d="M 117.5,378 L 120.8,381.5 L 126.6,374.5" fill="none" stroke="#3ecf6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="142" y="383" font-size="14.5" fill="#a9b0bf">Opens live on the page for anyone with Inkspect</text>
  <circle cx="122" cy="416" r="9" fill="none" stroke="#3ecf6e" stroke-width="2"/>
  <path d="M 117.5,416 L 120.8,419.5 L 126.6,412.5" fill="none" stroke="#3ecf6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="142" y="421" font-size="14.5" fill="#a9b0bf">Compressed into the URL hash — nothing uploaded</text>
  <circle cx="122" cy="454" r="9" fill="none" stroke="#3ecf6e" stroke-width="2"/>
  <path d="M 117.5,454 L 120.8,457.5 L 126.6,450.5" fill="none" stroke="#3ecf6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="142" y="459" font-size="14.5" fill="#a9b0bf">Or copy everything as structured text for tickets</text>

  <rect x="112" y="492" width="176" height="32" rx="16" fill="#3ecf6e" fill-opacity="0.12" stroke="#3ecf6e"/>
  <text x="200" y="513" font-size="13" font-weight="600" fill="#3ecf6e" text-anchor="middle">No server required</text>

  <!-- Screenshots card -->
  <g filter="url(#ds)"><rect x="660" y="220" width="540" height="460" rx="16" fill="#151820" stroke="#262c38" stroke-width="1.5"/></g>
  <text x="692" y="270" font-size="19" font-weight="700" fill="#e8eaf0">Annotated screenshots</text>

  <!-- thumbnail -->
  <rect x="692" y="292" width="240" height="330" rx="10" fill="#ffffff"/>
  <rect x="692" y="292" width="240" height="38" rx="10" fill="#f6f8fc"/>
  <rect x="692" y="312" width="240" height="18" fill="#f6f8fc"/>
  <circle cx="714" cy="312" r="6.5" fill="#5b8cff"/>
  <rect x="727" y="308" width="38" height="9" rx="4.5" fill="#8d97a8"/>
  <rect x="704" y="342" width="216" height="130" rx="10" fill="url(#hero)"/>
  <rect x="718" y="364" width="140" height="11" rx="5.5" fill="#fff" opacity="0.95"/>
  <rect x="718" y="382" width="98" height="11" rx="5.5" fill="#fff" opacity="0.85"/>
  <rect x="718" y="424" width="92" height="28" rx="14" fill="#fff"/>
  <rect x="731" y="434" width="66" height="8" rx="4" fill="#5b8cff"/>
  <rect x="704" y="490" width="216" height="8" rx="4" fill="#e2e6ee"/>
  <rect x="704" y="506" width="188" height="8" rx="4" fill="#e2e6ee"/>
  <rect x="704" y="536" width="100" height="70" rx="8" fill="#eef1f6"/>
  <rect x="712" y="544" width="84" height="32" rx="5" fill="#dbe1ec"/>
  <rect x="820" y="536" width="100" height="70" rx="8" fill="#eef1f6"/>
  <rect x="828" y="544" width="84" height="32" rx="5" fill="#dbe1ec"/>
  <!-- annotations on thumbnail -->
  <path d="M 702,312 C 698,300 720,294 738,298 C 754,302 758,316 744,322 C 728,328 706,324 702,314" fill="none" stroke="#ff5d5d" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="810" cy="438" r="10" fill="#ff5d5d" stroke="#fff" stroke-width="1.8"/>
  <text x="810" y="442" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <rect x="740" y="454" width="140" height="26" rx="7" fill="rgba(14,16,20,0.92)" stroke="#ff5d5d"/>
  <text x="750" y="471" font-size="11.5" fill="#fff">Make CTA full width</text>
  <rect x="700" y="532" width="108" height="78" fill="#3ecf6e" fill-opacity="0.08" stroke="#3ecf6e" stroke-width="1.6" stroke-dasharray="5 3.5"/>
  <text x="702" y="526" font-size="10" font-weight="700" fill="#3ecf6e" font-family="ui-monospace, Menlo, monospace">div.card</text>

  <text x="692" y="650" font-size="11.5" fill="#6f7686" font-family="ui-monospace, Menlo, monospace">inkspect-feedback-pricing-iphone-se.png</text>

  <!-- bullets -->
  <circle cx="968" cy="330" r="4" fill="#5b8cff"/>
  <text x="984" y="335" font-size="14.5" fill="#a9b0bf">One PNG per device viewport</text>
  <circle cx="968" cy="368" r="4" fill="#5b8cff"/>
  <text x="984" y="373" font-size="14.5" fill="#a9b0bf">Drawings baked into the image</text>
  <circle cx="968" cy="406" r="4" fill="#5b8cff"/>
  <text x="984" y="411" font-size="14.5" fill="#a9b0bf">Every note rendered right</text>
  <text x="984" y="431" font-size="14.5" fill="#a9b0bf">at its marker</text>
  <circle cx="968" cy="464" r="4" fill="#5b8cff"/>
  <text x="984" y="469" font-size="14.5" fill="#a9b0bf">Covers every page that</text>
  <text x="984" y="489" font-size="14.5" fill="#a9b0bf">has feedback</text>

  <rect x="964" y="524" width="200" height="42" rx="10" fill="#5b8cff"/>
  <path d="M 990,536 L 990,550 M 984,545 L 990,551 L 996,545" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="983" y1="556" x2="997" y2="556" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="1012" y="551" font-size="14.5" font-weight="600" fill="#fff">Screenshots</text>
  <text x="964" y="596" font-size="12.5" fill="#6f7686">saved straight to your Downloads folder</text>
</svg>
