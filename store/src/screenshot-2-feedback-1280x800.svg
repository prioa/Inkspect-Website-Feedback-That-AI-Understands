<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1014"/><stop offset="1" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#8fb0ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.13"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>

  <text x="80" y="96" font-size="44" font-weight="800" fill="#e8eaf0">Point, draw, comment — feedback that sticks.</text>
  <text x="80" y="138" font-size="20" fill="#a9b0bf">Pins, shapes, freehand and element picks — every note stays anchored to the page.</text>

  <!-- Phone with annotations -->
  <g filter="url(#ds)"><rect x="90" y="190" width="330" height="570" rx="14" fill="#151820" stroke="#262c38" stroke-width="1.5"/></g>
  <text x="104" y="214" font-size="13" font-weight="600" fill="#a9b0bf">iPhone SE</text>
  <text x="406" y="214" font-size="11" fill="#6f7686" text-anchor="end">375×667</text>
  <rect x="91.5" y="226" width="327" height="532" rx="10" fill="#ffffff"/>
  <rect x="91.5" y="226" width="327" height="48" rx="10" fill="#f6f8fc"/>
  <rect x="91.5" y="254" width="327" height="20" fill="#f6f8fc"/>
  <circle cx="118" cy="250" r="8" fill="#5b8cff"/>
  <rect x="134" y="245" width="48" height="10" rx="5" fill="#8d97a8"/>
  <rect x="376" y="242" width="20" height="3.5" rx="1.75" fill="#9aa4b5"/>
  <rect x="376" y="249" width="20" height="3.5" rx="1.75" fill="#9aa4b5"/>
  <rect x="376" y="256" width="20" height="3.5" rx="1.75" fill="#9aa4b5"/>
  <rect x="108" y="292" width="294" height="190" rx="12" fill="url(#hero)"/>
  <rect x="126" y="322" width="196" height="14" rx="7" fill="#fff" opacity="0.95"/>
  <rect x="126" y="345" width="138" height="14" rx="7" fill="#fff" opacity="0.85"/>
  <rect x="126" y="424" width="120" height="34" rx="17" fill="#fff"/>
  <rect x="142" y="437" width="88" height="9" rx="4.5" fill="#5b8cff"/>
  <rect x="108" y="508" width="294" height="9" rx="4.5" fill="#e2e6ee"/>
  <rect x="108" y="526" width="258" height="9" rx="4.5" fill="#e2e6ee"/>
  <rect x="108" y="544" width="224" height="9" rx="4.5" fill="#e2e6ee"/>
  <rect x="108" y="580" width="138" height="118" rx="10" fill="#eef1f6"/>
  <rect x="117" y="589" width="120" height="56" rx="6" fill="#dbe1ec"/>
  <rect x="117" y="655" width="92" height="8" rx="4" fill="#c9d0dc"/>
  <rect x="117" y="671" width="64" height="8" rx="4" fill="#c9d0dc"/>
  <rect x="264" y="580" width="138" height="118" rx="10" fill="#eef1f6"/>
  <rect x="273" y="589" width="120" height="56" rx="6" fill="#dbe1ec"/>
  <rect x="273" y="655" width="92" height="8" rx="4" fill="#c9d0dc"/>
  <rect x="273" y="671" width="64" height="8" rx="4" fill="#c9d0dc"/>

  <!-- red freehand loop around logo -->
  <path d="M 106,250 C 100,234 130,224 158,230 C 184,236 190,254 172,266 C 152,278 116,274 106,260 C 100,252 108,244 120,242" fill="none" stroke="#ff5d5d" stroke-width="3" stroke-linecap="round"/>

  <!-- orange arrow to burger menu -->
  <path d="M 330,330 L 378,268" fill="none" stroke="#ffb340" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 366,268 L 378,268 L 375,280" fill="none" stroke="#ffb340" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- red pin + note bubble at CTA -->
  <circle cx="252" cy="442" r="12" fill="#ff5d5d" stroke="#fff" stroke-width="2"/>
  <text x="252" y="447" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <rect x="268" y="452" width="188" height="32" rx="8" fill="rgba(14,16,20,0.92)" stroke="#ff5d5d" stroke-width="1.2"/>
  <text x="280" y="473" font-size="13" fill="#fff">Make the CTA full width</text>

  <!-- green element pick on card 1 -->
  <rect x="104" y="576" width="146" height="126" fill="#3ecf6e" fill-opacity="0.08" stroke="#3ecf6e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="106" y="568" font-size="12" font-weight="700" fill="#3ecf6e" font-family="ui-monospace, Menlo, monospace">div.card</text>
  <rect x="104" y="708" width="212" height="32" rx="8" fill="rgba(14,16,20,0.92)" stroke="#3ecf6e" stroke-width="1.2"/>
  <text x="116" y="729" font-size="13" fill="#fff">Align prices to the baseline</text>

  <!-- Feedback panel -->
  <g filter="url(#ds)"><rect x="880" y="190" width="320" height="470" rx="14" fill="#151820" stroke="#262c38" stroke-width="1.5"/></g>
  <text x="904" y="228" font-size="16" font-weight="700" fill="#e8eaf0">Feedback</text>
  <rect x="988" y="212" width="28" height="21" rx="10.5" fill="#262c38"/>
  <text x="1002" y="227" font-size="12" font-weight="600" fill="#a9b0bf" text-anchor="middle">4</text>
  <circle cx="1146" cy="222" r="1.8" fill="#a9b0bf"/><circle cx="1153" cy="222" r="1.8" fill="#a9b0bf"/><circle cx="1160" cy="222" r="1.8" fill="#a9b0bf"/>
  <text x="1183" y="228" font-size="14" fill="#6f7686" text-anchor="end">×</text>
  <text x="904" y="256" font-size="12.5" fill="#6f7686" font-family="ui-monospace, Menlo, monospace">/pricing</text>
  <line x1="904" y1="272" x2="1176" y2="272" stroke="#262c38"/>

  <text x="904" y="300" font-size="13.5" font-weight="600" fill="#e8eaf0">iPhone SE</text>
  <text x="1176" y="300" font-size="11.5" fill="#6f7686" text-anchor="end">375×667</text>

  <circle cx="917" cy="330" r="9" fill="#ff5d5d"/>
  <text x="917" y="334" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="936" y="335" font-size="13" fill="#e8eaf0">Make the CTA full width</text>

  <circle cx="917" cy="370" r="5" fill="#3ecf6e"/>
  <text x="936" y="375" font-size="13" fill="#e8eaf0">div.card — Align prices to the…</text>

  <circle cx="917" cy="410" r="5" fill="#ffb340"/>
  <text x="936" y="415" font-size="13" fill="#e8eaf0">Arrow — Menu icon too small</text>

  <circle cx="917" cy="450" r="5" fill="#ff5d5d"/>
  <text x="936" y="455" font-size="13" fill="#e8eaf0">Freehand</text>

  <line x1="904" y1="486" x2="1176" y2="486" stroke="#262c38"/>
  <rect x="904" y="508" width="130" height="36" rx="9" fill="#5b8cff"/>
  <text x="969" y="531" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Share as link</text>
  <rect x="1046" y="508" width="130" height="36" rx="9" fill="#262c38" stroke="#37404f"/>
  <text x="1111" y="531" font-size="13" font-weight="600" fill="#e8eaf0" text-anchor="middle">Screenshots</text>
  <text x="904" y="576" font-size="12" fill="#6f7686">3 annotated screenshots saved to your</text>
  <text x="904" y="594" font-size="12" fill="#6f7686">Downloads folder — notes included.</text>

  <!-- Tool palette -->
  <g filter="url(#ds)"><rect x="470" y="690" width="430" height="54" rx="27" fill="#151820" stroke="#262c38" stroke-width="1.5"/></g>
  <!-- pointer -->
  <path d="M 498,706 L 498,725 L 503,721 L 506.4,728.5 L 509.6,727.1 L 506.3,719.9 L 512,719.3 Z" fill="#e8eaf0"/>
  <!-- element picker (crosshair) -->
  <circle cx="540" cy="717" r="8" fill="none" stroke="#a9b0bf" stroke-width="2"/>
  <line x1="540" y1="704" x2="540" y2="709" stroke="#a9b0bf" stroke-width="2"/>
  <line x1="540" y1="725" x2="540" y2="730" stroke="#a9b0bf" stroke-width="2"/>
  <line x1="527" y1="717" x2="532" y2="717" stroke="#a9b0bf" stroke-width="2"/>
  <line x1="548" y1="717" x2="553" y2="717" stroke="#a9b0bf" stroke-width="2"/>
  <!-- pin (active) -->
  <rect x="566" y="700" width="34" height="34" rx="9" fill="#26314a"/>
  <circle cx="583" cy="713" r="6" fill="none" stroke="#5b8cff" stroke-width="2.4"/>
  <line x1="583" y1="719" x2="583" y2="729" stroke="#5b8cff" stroke-width="2.4"/>
  <!-- pen -->
  <path d="M 618,728 L 621,719 L 634,706 L 640,712 L 627,725 Z" fill="none" stroke="#a9b0bf" stroke-width="2" stroke-linejoin="round"/>
  <!-- rect -->
  <rect x="660" y="709" width="17" height="15" rx="2" fill="none" stroke="#a9b0bf" stroke-width="2"/>
  <!-- ellipse -->
  <ellipse cx="712" cy="717" rx="9.5" ry="7.5" fill="none" stroke="#a9b0bf" stroke-width="2"/>
  <!-- arrow -->
  <line x1="740" y1="726" x2="756" y2="708" stroke="#a9b0bf" stroke-width="2" stroke-linecap="round"/>
  <path d="M 748,708 L 756,708 L 755,716" fill="none" stroke="#a9b0bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- text tool -->
  <text x="778" y="725" font-size="17" font-weight="700" fill="#a9b0bf">T</text>
  <line x1="802" y1="704" x2="802" y2="730" stroke="#262c38"/>
  <!-- swatches -->
  <circle cx="822" cy="717" r="7" fill="#ff5d5d" stroke="#fff" stroke-width="2"/>
  <circle cx="844" cy="717" r="6.5" fill="#ffb340"/>
  <circle cx="866" cy="717" r="6.5" fill="#3ecf6e"/>
  <circle cx="888" cy="717" r="6.5" fill="#5b8cff"/>
</svg>
