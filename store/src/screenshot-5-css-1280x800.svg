    <text x="112" y="512" fill="#37404f">9</text><text x="156" y="512" fill="#7fd0ff">border-radius<tspan fill="#6f7686">:</tspan> <tspan fill="#7fd88f">9999px</tspan><tspan fill="#6f7686">;</tspan></text>
    <text x="105" y="536" fill="#37404f">10</text><text x="156" y="536" fill="#7fd0ff">padding<tspan fill="#6f7686">:</tspan> <tspan fill="#7fd88f">14px 32px</tspan><tspan fill="#6f7686">;</tspan></text>
    <text x="105" y="560" fill="#37404f">11</text><text x="140" y="560" fill="#6f7686">}</text>
    <text x="105" y="608" fill="#37404f">13</text><text x="140" y="608" fill="#ffb340">.nav a:hover <tspan fill="#6f7686">{</tspan></text>
    <text x="105" y="632" fill="#37404f">14</text><text x="156" y="632" fill="#7fd0ff">color<tspan fill="#6f7686">:</tspan> <tspan fill="#7fd88f">#34d399</tspan><tspan fill="#6f7686">;</tspan></text>
    <text x="105" y="656" fill="#37404f">15</text><text x="140" y="656" fill="#6f7686">}</text>
  </g>

