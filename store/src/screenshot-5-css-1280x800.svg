    <text x="112" y="392" fill="#37404f">4</text><text x="156" y="392" fill="#7fd0ff">border-radius<tspan fill="#6f7686">:</tspan> <tspan fill="#7fd88f">20px</tspan><tspan fill="#6f7686">;</tspan></text>
    <text x="112" y="416" fill="#37404f">5</text><text x="140" y="416" fill="#6f7686">}</text>
    <text x="112" y="464" fill="#37404f">7</text><text x="140" y="464" fill="#ffb340">.cta <tspan fill="#6f7686">{</tspan></text>
